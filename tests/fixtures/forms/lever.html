<!doctype html>
<html>
<head><meta charset="utf-8"><title>Acme AI - Machine Learning Engineer</title></head>
<body>
<div class="posting-headline"><h2>Machine Learning Engineer</h2></div>
<form id="application-form" class="application-form" method="post" enctype="multipart/form-data">
  <ul>
    <li class="application-question resume"><label><div class="application-label">Resume/CV<span class="required">✱</span></div><div class="application-field"><input type="file" name="resume" required></div></label></li>
    <li class="application-question"><label><div class="application-label">Full name<span class="required">✱</span></div><div class="application-field"><input type="text" name="name" required></div></label></li>
    <li class="application-question"><label><div class="application-label">Email<span class="required">✱</span></div><div class="application-field"><input type="email" name="email" required></div></label></li>
    <li class="application-question"><label><div class="application-label">Phone</div><div class="application-field"><input type="text" name="phone"></div></label></li>
    <li class="application-question"><label><div class="application-label">Current company</div><div class="application-field"><input type="text" name="org"></div></label></li>
    <li class="application-question"><label><div class="application-label">LinkedIn URL</div><div class="application-field"><input type="text" name="urls[LinkedIn]"></div></label></li>
    <li class="application-question"><label><div class="application-label">GitHub URL</div><div class="application-field"><input type="text" name="urls[GitHub]"></div></label></li>
  </ul>
  <ul>
    <li class="application-question custom-question">
      <div class="application-label"><div class="text">Will you now or in the future require sponsorship to work in the US?<span class="required">✱</span></div></div>
      <div class="application-field"><ul data-qa="multiple-choice">
        <li><label><input type="radio" name="cards[abc][field0]" value="Yes" required><span class="application-answer-alternative">Yes</span></label></li>
        <li><label><input type="radio" name="cards[abc][field0]" value="No"><span class="application-answer-alternative">No</span></label></li>
      </ul></div>
    </li>
    <li class="application-question custom-question">
      <div class="application-label"><div class="text">Which office would you work from?</div></div>
      <div class="application-field"><ul data-qa="checkboxes">
        <li><label><input type="checkbox" name="cards[abc][field1]" value="Austin"><span>Austin</span></label></li>
        <li><label><input type="checkbox" name="cards[abc][field1]" value="New York"><span>New York</span></label></li>
        <li><label><input type="checkbox" name="cards[abc][field1]" value="Remote"><span>Remote</span></label></li>
      </ul></div>
    </li>
    <li class="application-question custom-question">
      <div class="application-label"><div class="text">I acknowledge the candidate privacy notice<span class="required">✱</span></div></div>
      <div class="application-field"><label><input type="checkbox" name="cards[abc][field2]" value="ack" required><span>I acknowledge</span></label></div>
    </li>
  </ul>
  <li class="application-question"><label><div class="application-label">Additional information</div><div class="application-field"><textarea name="comments"></textarea></div></label></li>
  <button type="submit" id="btn-submit" class="template-btn-submit">Submit application</button>
</form>
<script src="mock-submit.js"></script>
</body>
</html>
